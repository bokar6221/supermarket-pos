name: Build Android POS APK

on:
  push:
    branches: [main, "qayem-competitive-v1", "offline-first-rebuild-v2", "license-device-management-v1"]
    paths:
      - "android-app/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "db.js"
      - "catalog.js"
      - "accounts.js"
      - "firebase-sync.js"
      - "access-gate.js"
      - "sw.js"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "tests/**"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    branches: [main, "qayem-competitive-v1", "offline-first-rebuild-v2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check db.js
          node --check catalog.js
          node --check accounts.js
          node --check access-gate.js
          node --input-type=module --check < firebase-sync.js

      - name: Install browser database test dependency
        run: npm install --no-save fake-indexeddb@6

      - name: Validate POS data integrity and UI references
        run: |
          node tests/validate-integrity.js
          node --require fake-indexeddb/auto tests/data-integrity.test.cjs

      - name: Sync web app into Android assets
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp index.html app.js db.js styles.css catalog.js accounts.js access-gate.js firebase-sync.js icon.svg manifest.json android-app/app/src/main/assets/www/

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK package and signature
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='com.supermarket.pos'" /tmp/apk-badging.txt
          grep -F "versionCode='13'" /tmp/apk-badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-pos-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
