name: Build signed Android POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - cashiro-commercial-release-v1
    tags:
      - "cashiro-v*"
    paths:
      - "firestore.rules"
      - "tests/firestore-rules.test.mjs"
      - ".github/workflows/build-android-release.yml"

permissions:
  contents: read

jobs:
  rules-tests:
    name: Test Firestore Security Rules before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned emulator test tools
        run: npm install --no-save --package-lock=false firebase@13.2.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0

      - name: Run Firestore Rules tests against emulator only
        run: npx firebase-tools emulators:exec --only firestore --project demo-supermarket-pos "node tests/firestore-rules.test.mjs"

  build-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/cashiro-v')
    needs: rules-tests
    name: Build and verify signed commercial APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Configure protected release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/supermarket-pos-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate JavaScript and database integrity
        run: |
          node --check app.js
          node --check db.js
          node --check catalog.js
          node --check accounts.js
          node --check access-gate.js
          node --input-type=module --check < firebase-sync.js
          npm install --no-save fake-indexeddb@6
          node tests/validate-integrity.js
          node --require fake-indexeddb/auto tests/data-integrity.test.cjs

      - name: Sync web app into Android assets
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp index.html app.js db.js styles.css catalog.js accounts.js access-gate.js firebase-sync.js icon.svg manifest.json privacy.html android-app/app/src/main/assets/www/

      - name: Build signed Release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify Release package and signature
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='com.supermarket.pos'" /tmp/apk-badging.txt
          grep -F "versionCode='16'" /tmp/apk-badging.txt
          grep -F "versionName='1.12.0'" /tmp/apk-badging.txt
          grep -F "targetSdkVersion:'36'" /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          sha256sum "$APK" | tee /tmp/cashiro-apk-sha256.txt

      - name: Upload signed commercial APK
        uses: actions/upload-artifact@v4
        with:
          name: cashiro-android-release-1.12.0
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
