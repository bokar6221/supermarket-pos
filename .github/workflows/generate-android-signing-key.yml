name: Generate Android release signing key (one time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-signing-key:
    name: Generate protected Android signing material
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate one permanent release keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          OUT="$RUNNER_TEMP/android-signing-package"
          mkdir -p "$OUT"

          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="supermarket-pos"
          KEY_PASSWORD="$STORE_PASSWORD"

          # Mask credentials in case a later command accidentally prints them.
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          keytool -genkeypair -v \
            -keystore "$OUT/supermarket-pos-release.jks" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Supermarket POS Release, OU=Android, O=Supermarket POS, L=Alexandria, ST=Alexandria, C=EG"

          test -s "$OUT/supermarket-pos-release.jks"

          {
            printf '%s\n' "ANDROID_KEYSTORE_BASE64=$(base64 -w 0 "$OUT/supermarket-pos-release.jks")"
            printf '%s\n' "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            printf '%s\n' "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            printf '%s\n' "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } > "$OUT/github-secrets.txt"

          chmod 600 "$OUT/supermarket-pos-release.jks" "$OUT/github-secrets.txt"

          # Do not print the key, password, or Base64 value to the Actions log.
          echo "Signing keystore generated. Credentials are included only in the short-lived artifact."

      - name: Upload one-time signing package
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-pos-signing-package
          path: |
            ${{ runner.temp }}/android-signing-package/supermarket-pos-release.jks
            ${{ runner.temp }}/android-signing-package/github-secrets.txt
          if-no-files-found: error
          retention-days: 1
